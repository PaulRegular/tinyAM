  <title
     id="title">tinyAM — refined cohort-wave logo</title>
  <desc
     id="desc">Seven warm-to-cool waves form two cohort humps shifting right as they rise. Growing cod silhouettes follow the cohorts. Larger cream lettering has regular tiny and bold AM.</desc>
