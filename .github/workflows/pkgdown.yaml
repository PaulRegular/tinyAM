name: Package website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          needs: website
          extra-packages: local::.
      - uses: actions/configure-pages@v5
      - name: Build package documentation
        shell: Rscript {0}
        run: |
          Sys.setenv(TINYAM_GUIDE_ROOT = getwd(),
            TINYAM_GUIDE_FITS = file.path(getwd(), "data-raw", "cache",
              "vignettes", "simulated-cod-dashboard.rds"),
            TINYAM_ZEROS_GUIDE_FITS = file.path(getwd(), "data-raw", "cache",
              "vignettes", "northern-cod-zeros-dashboard.rds"))
          pkgdown::build_site(preview = FALSE)
      - name: Build dashboards from guide fits
        shell: Rscript {0}
        run: |
          pkgload::load_all(".", quiet = TRUE, helpers = FALSE)
          source_paths <- c(file.path("R", list.files("R", "[.]R$")), "NAMESPACE")
          versions <- c(tinyAM = as.character(packageVersion("tinyAM")),
            R = as.character(getRversion()), RTMB = as.character(packageVersion("RTMB")),
            mgcv = as.character(packageVersion("mgcv")),
            tweedie = as.character(packageVersion("tweedie")))
          sources <- tools::md5sum(source_paths)
          build_dashboard <- function(slug, inputs, truth = NULL) {
            path <- file.path("data-raw", "cache", "vignettes", paste0(slug, "-dashboard.rds"))
            if (!file.exists(path)) stop("The guide did not save its fitted models: ", slug)
            example <- readRDS(path)
            if (!identical(example$sources, sources)) {
              stop("Rebuild the guide before rendering its dashboard: ", slug)
            }
            stopifnot(identical(example$versions, versions),
              identical(example$inputs, inputs), identical(example$truth, truth),
              length(example$models) > 0L,
              all(vapply(example$models, inherits, logical(1), "tam_fit")))
            output <- file.path("docs", "examples", slug, "index.html")
            dir.create(dirname(output), recursive = TRUE, showWarnings = FALSE)
            vis_tam(model_list = example$models, background = example$background,
              output_file = output, open_file = FALSE)
            stopifnot(file.exists(output))
          }
          build_dashboard("simulated-cod", sim_cod_obs, sim_cod_truth)
          build_dashboard("northern-cod-zeros", cod_obs)
          stopifnot(!"SimSurvey" %in% loadedNamespaces())
      - name: Build combined dashboard
        run: Rscript cheatsheet/examples.R dashboard
      - name: Add cheatsheet and dashboard
        shell: Rscript {0}
        run: |
          unlink("docs/AGENTS.html")
          sitemap <- xml2::read_xml("docs/sitemap.xml")
          xml2::xml_remove(xml2::xml_find_all(sitemap, "//*[local-name()='url'][*[local-name()='loc' and contains(., '/AGENTS.html')]]"))
          xml2::write_xml(sitemap, "docs/sitemap.xml")
          dir.create("docs/cheatsheet/output", recursive = TRUE, showWarnings = FALSE)
          stopifnot(file.copy("cheatsheet/output/tinyAM_dashboard.html", "docs/cheatsheet/index.html", overwrite = TRUE))
          stopifnot(file.copy("cheatsheet/tinyAM_cheatsheet.pdf", "docs/cheatsheet/tinyAM_cheatsheet.pdf", overwrite = TRUE))
          writeLines('<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=../index.html"><a href="../index.html">Open dashboard</a>', "docs/cheatsheet/output/tinyAM_dashboard.html")
          stopifnot(all(file.exists(c("docs/index.html", "docs/reference/index.html",
            "docs/cheatsheet/index.html", "docs/cheatsheet/tinyAM_cheatsheet.pdf",
            "docs/examples/simulated-cod/index.html", "docs/examples/northern-cod-zeros/index.html"))))
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
